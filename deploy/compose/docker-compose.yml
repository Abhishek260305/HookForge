services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hookforge
      POSTGRES_PASSWORD: hookforge
      POSTGRES_DB: hookforge
    ports:
      - "5432:5432"
    volumes:
      - hookforge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookforge -d hookforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  graphql-gateway:
    build:
      context: ../../services/graphql-gateway
    environment:
      HTTP_ADDR: ":8080"
      CONTROL_PLANE_URL: http://control-plane-svc:8081
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      control-plane-svc:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  control-plane-svc:
    build:
      context: ../../services/control-plane-svc
    environment:
      HTTP_ADDR: ":8081"
      DATABASE_URL: postgres://hookforge:hookforge@postgres:5432/hookforge?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  hookforge_pg:
